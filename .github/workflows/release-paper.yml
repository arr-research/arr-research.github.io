# SPDX-License-Identifier: AGPL-3.0-or-later
name: Create ARR record release

on:
  workflow_dispatch:
    inputs:
      paper_id:
        description: "ARR public identifier, e.g. ARR-2026-01K2M3N4P5Q6R7S8"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.paper_id }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out accepted source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate all records
        run: python scripts/validate_papers.py
      - name: Build PDF when LaTeX is the canonical source
        shell: bash
        run: |
          paper_id='${{ inputs.paper_id }}'
          metadata_path="$(find papers -path "*/$paper_id/metadata.json" -print -quit)"
          if [[ -z "$metadata_path" ]]; then
            echo "ARR record not found: $paper_id" >&2
            exit 1
          fi
          paper_dir="$(dirname "$metadata_path")"
          source_of_truth="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["source_of_truth"])' "$metadata_path")"
          if [[ "$source_of_truth" == "paper.tex" ]]; then
            if [[ ! -f "$paper_dir/paper.tex" ]]; then
              echo "Canonical LaTeX source is missing: $paper_dir/paper.tex" >&2
              exit 1
            fi
            sudo apt-get update
            sudo apt-get install -y \
              biber \
              latexmk \
              texlive-bibtex-extra \
              texlive-fonts-recommended \
              texlive-latex-extra
            (
              cd "$paper_dir"
              latexmk -pdf -interaction=nonstopmode -halt-on-error paper.tex
            )
          else
            echo "Preserving canonical source byte-for-byte: $source_of_truth"
          fi
      - name: Build immutable package
        run: python scripts/package_paper.py "${{ inputs.paper_id }}"
      - name: Resolve version and release path
        id: record
        shell: bash
        run: |
          paper_id='${{ inputs.paper_id }}'
          metadata_path="$(find papers -path "*/$paper_id/metadata.json" -print -quit)"
          if [[ -z "$metadata_path" ]]; then
            echo "ARR record not found: $paper_id" >&2
            exit 1
          fi
          version="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["version"])' "$metadata_path")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "directory=dist/release/$paper_id/$version" >> "$GITHUB_OUTPUT"
          echo "tag=$paper_id-$version" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release and upload heavy assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAPER_ID: ${{ inputs.paper_id }}
          VERSION: ${{ steps.record.outputs.version }}
          RELEASE_DIR: ${{ steps.record.outputs.directory }}
          TAG: ${{ steps.record.outputs.tag }}
        run: |
          mapfile -d '' assets < <(find "$RELEASE_DIR" -maxdepth 1 -type f ! -name RELEASE_NOTES.md -print0)
          gh release create "$TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$PAPER_ID $VERSION" \
            --notes-file "$RELEASE_DIR/RELEASE_NOTES.md"
