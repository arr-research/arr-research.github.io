# SPDX-License-Identifier: AGPL-3.0-or-later
name: Publish AIRR catalogue

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      canonical_url: ${{ steps.catalogue.outputs.canonical_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate records
        run: python scripts/validate_papers.py
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Snapshot public activity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/sync_metrics.py
          --repository "$GITHUB_REPOSITORY"
          --output "$RUNNER_TEMP/arr-metrics.json"
      - name: Restore verified historical PDFs
        uses: actions/cache@v5
        with:
          path: work/pdf-cache
          key: arr-pdfs-v1-${{ hashFiles('papers/**/metadata.json') }}
          restore-keys: arr-pdfs-v1-
      - name: Build catalogue
        id: catalogue
        shell: bash
        env:
          ARR_GOOGLE_SITE_VERIFICATION: |-
            ${{ vars.ARR_GOOGLE_SITE_VERIFICATION }}
            ${{ vars.ARR_GOOGLE_SITE_VERIFICATION_AIRR }}
          AIRR_BING_SITE_VERIFICATION: ${{ vars.AIRR_BING_SITE_VERIFICATION }}
          ARR_INTAKE_URL: ${{ vars.ARR_INTAKE_URL }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          base_path="$PAGES_BASE_PATH"
          canonical_url="${PAGES_BASE_URL%/}"
          test -n "$canonical_url"
          # Keep discovery URLs on HTTPS while a new domain certificate is issued.
          canonical_url="${canonical_url/#http:/https:}"
          echo "canonical_url=$canonical_url" >> "$GITHUB_OUTPUT"
          python scripts/build_site.py \
            --base-path "$base_path" \
            --canonical-url "$canonical_url" \
            --repository "$GITHUB_REPOSITORY" \
            --metrics-file "$RUNNER_TEMP/arr-metrics.json" \
            --intake-url "$ARR_INTAKE_URL" \
            --google-site-verification "$ARR_GOOGLE_SITE_VERIFICATION" \
            --bing-site-verification "$AIRR_BING_SITE_VERIFICATION" \
            --fetch-remote-pdfs
          python scripts/check_site_indexing.py --canonical-url "$canonical_url"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Check out repository for IndexNow
        uses: actions/checkout@v7
      - name: Set up Python for IndexNow
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Notify participating search engines
        env:
          SITE_ROOT: ${{ needs.build.outputs.canonical_url }}
        run: >-
          python scripts/submit_indexnow.py
          --site-root "$SITE_ROOT"
          --key-file site/indexnow-key.txt
