name: Publish ARR catalogue

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate records
        run: python scripts/validate_papers.py
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Build catalogue
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          owner_name="${GITHUB_REPOSITORY%/*}"
          if [[ "$repo_name" == "$owner_name.github.io" ]]; then
            base_path=""
            canonical_url="https://$owner_name.github.io"
          else
            base_path="/$repo_name"
            canonical_url="https://$owner_name.github.io/$repo_name"
          fi
          python scripts/build_site.py \
            --base-path "$base_path" \
            --canonical-url "$canonical_url" \
            --repository "$GITHUB_REPOSITORY"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
