# SPDX-License-Identifier: AGPL-3.0-or-later
name: Validate ARR records

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate paper records
        run: python scripts/validate_papers.py
      - name: Build static catalogue
        run: python scripts/build_site.py --base-path "/preview" --repository "$GITHUB_REPOSITORY"
