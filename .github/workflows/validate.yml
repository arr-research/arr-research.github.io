# SPDX-License-Identifier: AGPL-3.0-or-later
name: Validate ARR records

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install intake dependencies
        run: python -m pip install --disable-pip-version-check -r services/intake/requirements.txt
      - name: Run repository and private-intake tests
        env:
          ARR_SESSION_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-ci-only-secret
        run: python -m unittest discover -s tests -v
      - name: Validate ARR records
        run: python scripts/validate_papers.py
      - name: Build static catalogue
        run: >-
          python scripts/build_site.py --base-path "/preview"
          --canonical-url "https://example.test/preview"
          --repository "$GITHUB_REPOSITORY"
      - name: Check scholarly discovery links
        run: python scripts/check_site_indexing.py --canonical-url "https://example.test/preview"
