{% extends 'base.html' %}{% block title %}Sign in — ARR intake{% endblock %}{% block content %}
<h1>Private, invitation-only intake</h1><p>No submission is public at this stage.</p>
<form class="card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Email <input type="email" name="email" autocomplete="username" required></label>
<label>Password <input type="password" name="password" autocomplete="current-password" required></label>
<label>Editor one-time code <input name="totp" inputmode="numeric" autocomplete="one-time-code" maxlength="6"><span class="meta">Required for operators and independent editors.</span></label>
<button>Sign in</button></form>{% endblock %}
