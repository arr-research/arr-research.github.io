{% extends 'base.html' %}{% block title %}Create account — ARR intake{% endblock %}{% block content %}
<h1>Create your invited account</h1><p>The invitation is bound to <strong>{{ invite['email'] }}</strong>.</p>
<form class="card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Name <input name="display_name" maxlength="200" required></label>
<label>Password <input type="password" name="password" minlength="12" autocomplete="new-password" required></label>
<label><input type="checkbox" name="adult" required> I am at least 18 and can enter the deposit agreement.</label>
<button>Create account</button></form>{% endblock %}
