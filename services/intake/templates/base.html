<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>{% block title %}AIRR.SCIENCE private submissions{% endblock %}</title>
<style>
body{font:16px/1.5 system-ui;max-width:960px;margin:auto;padding:2rem;background:#0b0f17;color:#eef2f7}a{color:#8bd5ff}nav{display:flex;gap:1rem;align-items:center}nav form{margin-left:auto}main{margin-top:2rem}article,form.card,section.card{background:#151c28;border:1px solid #2b3748;border-radius:10px;padding:1rem;margin:1rem 0}label{display:block;margin:.8rem 0}input,textarea,select,button{font:inherit}input,textarea,select{box-sizing:border-box;width:100%;padding:.6rem;background:#0b0f17;color:#eef2f7;border:1px solid #53647a;border-radius:5px}input[type=checkbox]{width:auto}button{padding:.6rem 1rem}.flash{padding:.8rem;border-left:4px solid #8bd5ff;background:#172332}.error{border-color:#ff7b72}.warning{border-color:#d29922}.meta{color:#aab6c5;font-size:.9rem}.status{font-weight:700}.danger{border-color:#ff7b72}.trap{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.6rem;border-bottom:1px solid #2b3748}pre{max-height:32rem;overflow:auto;white-space:pre-wrap;background:#0b0f17;border:1px solid #53647a;padding:1rem;font:12px/1.45 ui-monospace,monospace}
body{background:#080b10}nav{flex-wrap:wrap;justify-content:space-between;border-bottom:1px solid #b9954938;padding-bottom:1.5rem}nav img{display:block;width:320px;max-width:100%;height:auto}nav>a:first-child{max-width:75%}h1{font-family:Georgia,serif;font-size:clamp(1.9rem,5vw,2.8rem);line-height:1.15}h2{font-size:1.2rem}button,.button{display:inline-block;background:#e1b85b;color:#141414;border:1px solid #e1b85b;border-radius:5px;padding:.65rem 1rem;text-decoration:none;cursor:pointer}.eyebrow{color:#e1b85b;font-size:.8rem;text-transform:uppercase;letter-spacing:.1em}.registration-number{font:700 clamp(1rem,3vw,1.4rem)/1.5 ui-monospace,monospace;color:#f0cb79;overflow-wrap:anywhere}.fingerprint{overflow-wrap:anywhere;font:13px/1.5 ui-monospace,monospace}#donation-reference{font-family:ui-monospace,monospace}#copy-status{font-size:.9rem;color:#e1b85b}a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f0cb79;outline-offset:3px}@media(max-width:600px){body{padding:1rem}nav{gap:.6rem}article,form.card,section.card{padding:1rem}nav>a:first-child{max-width:100%}}
[hidden]{display:none!important}.subject-fields{border:1px solid #53647a;padding:1rem;margin:1rem 0;min-width:0}.subject-fields legend{font-weight:700;color:#e1b85b}.subject-fields p{overflow-wrap:anywhere}.subject-fields select{width:100%;max-width:100%;min-width:0;text-overflow:ellipsis}.subject-fields summary{cursor:pointer;min-height:44px;display:flex;align-items:center}.subject-picker{min-width:0}select:focus-visible,summary:focus-visible{outline:3px solid #f0cb79;outline-offset:3px}
.preserve-lines{white-space:pre-wrap;overflow-wrap:anywhere}.two-fields{display:grid;grid-template-columns:1fr 1fr;gap:1rem}details{margin:1rem 0}summary{cursor:pointer;padding:.5rem 0}td{overflow-wrap:anywhere}@media(max-width:600px){.two-fields{grid-template-columns:1fr}table{font-size:.85rem}}
</style></head><body>
<nav><a href="{{ url_for('dashboard') if g.user else url_for('submit') }}"><img src="{{ url_for('static', filename='airr-logo.png') }}" alt="AIRR.SCIENCE — Archive for Independent &amp; Rigorous Research" width="1859" height="336"></a>{% if g.user %}<span>{{ g.user['display_name'] }} · {{ g.user['role'] }}</span><form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Sign out</button></form>{% else %}<a href="{{ url_for('login') }}">Editor sign in</a>{% endif %}</nav>
<main>{% for category,message in get_flashed_messages(with_categories=true) %}<p class="flash {{ category }}">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main>
</body></html>
